name: FLE test

on:
  workflow_dispatch:
    inputs:
      value1:
        description: "Value 1"
      value2:
        description: "Value 2"

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Check variables
        run: |
          v1="${{ github.event.inputs.value1 }}"
          if [ -z "$v1" ]; then
            echo "❌ value1 is empty."
            exit 1
          else
            echo "✅ value1 is $v1"
          fi
          v2="${{ github.event.inputs.value2 }}"
          if [ -z "$v2" ]; then
            echo "❌ value2 is empty."
            exit 1
          else
            echo "✅ value2 is $v2"
          fi
